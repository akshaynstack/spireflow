services:
  api:
    build:
      context: .
      # For a GPU host, point this at a CUDA torch channel and set a GPU base image.
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: spireflow-api:latest
    ports:
      - "${SPIREFLOW_PORT:-8000}:8000"
    environment:
      # First run boots this key so you can call the API immediately.
      SPIREFLOW_BOOTSTRAP_KEY: ${SPIREFLOW_BOOTSTRAP_KEY:-sk-spireflow-dev-local-key}
      SPIREFLOW_MODEL: ${SPIREFLOW_MODEL:-phonon-2.5}
      SPIREFLOW_REQUIRE_AUTH: ${SPIREFLOW_REQUIRE_AUTH:-true}
      SPIREFLOW_MAX_UPLOAD_MB: ${SPIREFLOW_MAX_UPLOAD_MB:-100}
      SPIREFLOW_DB: /data/spireflow.db
      FERMION_CACHE_DIR: /data/fermion-cache
    volumes:
      - spireflow-data:/data
    restart: unless-stopped

volumes:
  spireflow-data:
