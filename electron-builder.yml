appId: com.spireflow.dictation
productName: Spireflow
copyright: Copyright © 2026 Spireflow

directories:
  output: release
  buildResources: build

# Drop the other platforms' key-server binaries before archiving (size + AV false positives).
afterPack: tools/afterPack.js

# Only the compiled app + its production deps ship inside app.asar.
files:
  - out/**/*
  - package.json
  # App + system-tray icons (read at runtime from app.getAppPath()/build).
  - build/icon.png
  - build/icon.ico
  - build/tray.png
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - "!**/*.map"

# Native binaries that cannot be loaded from inside an asar archive.
asarUnpack:
  - node_modules/node-global-key-listener/bin/**
  - node_modules/ffmpeg-static/**

# Fully self-contained: the frozen Python sidecar and the model weights ride
# next to the app and are used directly (no download, no separate install).
# The licence/attribution files travel with the redistributed model and FFmpeg.
extraResources:
  - from: server/dist/spireflow-sidecar
    to: sidecar
  - from: build/fermion-cache
    to: fermion-cache
  - from: LICENSE
    to: licenses/LICENSE
  - from: NOTICE
    to: licenses/NOTICE
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: LICENSES
    to: licenses/texts

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Spireflow
  artifactName: ${productName}-Setup-${version}.${ext}
  uninstallDisplayName: Spireflow

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  # Build only the runner's own CPU arch: the frozen sidecar cannot be
  # cross-compiled, so an x64 .dmg must be built on an x64 macOS runner.
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Spireflow uses your microphone to turn speech into text on your device.
    NSHumanReadableCopyright: Copyright © 2026 Spireflow

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
