name: Bug report
description: Something does not work as expected
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, secrets or private
        recordings. For security issues, follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behaviour you saw and what you expected instead.
      placeholder: I pressed the shortcut and ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the app with `npm run dev`
        2. Hold Ctrl+Space
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spireflow version
      description: Shown in About, or `package.json` when running from source.
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version (if running from source)
      placeholder: "3.12.4"
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Built a local installer
        - Running from source (`npm run dev`)
        - GitHub Actions artifact
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste sidecar/Electron output or attach screenshots. Remove anything private.
      render: shell
