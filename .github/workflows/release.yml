name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per target arch: PyInstaller (the sidecar) cannot cross-compile,
        # so each arch is frozen natively on a matching runner.
        include:
          - name: windows
            os: windows-latest
            target: --win --x64
            artifact: release/*.exe
          - name: macos-arm64
            os: macos-latest
            target: --mac --arm64
            artifact: release/*.dmg
          # Intel Macs run on the x64 image. Comment in if you need universal support.
          # - name: macos-x64
          #   os: macos-15-intel
          #   target: --mac --x64
          #   artifact: release/*.dmg
    env:
      # Ad-hoc sign locally; set up Developer ID secrets for notarized releases.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Create venv and install Python dependencies
        shell: bash
        run: |
          python -m venv server/.venv
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY="server/.venv/Scripts/python.exe"
          else
            PY="server/.venv/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r server/requirements.txt "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.8"

      - name: Prefetch Phonon-2 weights
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY="server/.venv/Scripts/python.exe"
          else
            PY="server/.venv/bin/python"
          fi
          "$PY" -c "import fermion; fermion.load_speech('phonon-2')"

      - name: Build production bundle
        run: npm run build

      - name: Freeze the sidecar
        run: npm run build:sidecar

      - name: Stage the model weights
        run: npm run stage:model

      - name: Package the installer
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: spireflow-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Only tag pushes (e.g. `git push origin v0.1.0`) publish a release; branch
    # pushes just build and keep the installers as workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show installers
        run: find artifacts -type f

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          files=$(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \))
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $files
          fi
